name: Quarterly BA ETL - check only

on:
  push:
    branches:
      - feature/welcome-page
    paths:
      - ".github/workflows/quarterly_ba_check.yml"
      - "etl/quarterly/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-quarterly-ba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: etl/quarterly/requirements-etl.txt

      - name: Install quarterly ETL dependencies
        run: |
          python -m pip install -r etl/quarterly/requirements-etl.txt

      - name: Validate Python scripts
        run: |
          python -m compileall -q etl/quarterly

      - name: Check Bundesagentur fuer Arbeit for missing quarters (read-only)
        run: |
          python etl/quarterly/run_quarterly.py --pages 10
